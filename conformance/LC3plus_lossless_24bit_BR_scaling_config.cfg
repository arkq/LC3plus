# This file contains settings needed for lc3plus_conformance.py
# Generated by scaling_configs/gen_scaling_configs.py — regenerate via:
#   python3 scaling_configs/gen_scaling_configs.py
#
# Mirrors the scope of LC3plus_lossless_24bit_BR_config.cfg
# but routes each row through test_cbr_scaling so the per-frame shift sweep
# ([0,1,4] from ZERO_LSB_SHIFTS) runs on top.
#
# run_conformance.sh substitutes the REPLACE_WITH_* tags below at runtime.

[globals]

#enabled_tests = LC3plus_lossless_br_44_24, LC3plus_lossless_br_48_24, LC3plus_lossless_br_96_24, LC3plus_lossless_br_192_24, LC3plus_lossless_br_stereo_24
enabled_tests = LC3plus_lossless_br_44_24, LC3plus_lossless_br_48_24, LC3plus_lossless_br_96_24, LC3plus_lossless_br_192_24

ref_encoder = REPLACE_WITH_REF_EXE -E -q -lossless -formatG192 -frame_ms {frame_size} {options} "{input}" "{output}" {bitrate}
ref_decoder = REPLACE_WITH_REF_EXE -D -q -formatG192 {options} "{input}" "{output}"
tst_encoder = REPLACE_WITH_TST_EXE -E -q -lossless -formatG192 -frame_ms {frame_size} {options} "{input}" "{output}" {bitrate}
tst_decoder = REPLACE_WITH_TST_EXE -D -q -formatG192 {options} "{input}" "{output}"

peaq_bin       = REPLACE_WITH_PEAQ_BIN "{reference}" "{test}"
peaq_odg_regex = REPLACE_WITH_PEAQ_REGEX

option_bandwidth      = -bandwidth "{arg}"
option_ep_debug       = -ep_dbg "{arg}"
option_ep_mode        = -epmode {arg}
option_ll_shift = -ll_shift {arg}

hrmode   = 0
lossless = 1

#################################################################
####################### TESTS ###################################
#################################################################

[LC3plus_lossless_br_44_24]
test_cbr_scaling = 1
cbr_scaling_encode_metric = odg_rms
cbr_scaling_encdec_metric = odg_rms
cbr_scaling_decode_metric = odg_rms
cbr_scaling_encode_odg_threshold = [0.06, 0.08, 0.12]
cbr_scaling_encdec_odg_threshold = [0.06, 0.08, 0.12]
cbr_scaling_decode_odg_threshold = [0.06, 0.08, 0.12]
cbr_scaling_encode_rms_threshold = 14
cbr_scaling_encdec_rms_threshold = 14
cbr_scaling_decode_rms_threshold = 14
cbr_scaling_encode_mad_threshold = 0.00148
cbr_scaling_encdec_mad_threshold = 0.00148
cbr_scaling_decode_mad_threshold = 0.00148
# Per-frame fixed shifts swept by the scaling test.
cbr_scaling_shifts = 0, 1, 4, 8
# Input-prep variants ('orig' = raw item, 'up24_from_16' = 16-bit
# source L_shl 8 into a 24-bit container, 'zlsb' = bottom-N bits
# zeroed for bit-exact roundtrip).
cbr_scaling_input_prep = up24_from_16
# Mode, Frame Size, Samplerate, Bitrate, Bitdepth
configs = encode, 10  ,  44100,  124800, 24
          encode, 7.5 ,  44100,  124800, 24
          encode, 5   ,  44100,  148800, 24
          encode, 2.5 ,  44100,  172800, 24
          encode, 1.25,  44100,  204800, 24
          encdec, 10  ,  44100,  124800, 24
          encdec, 7.5 ,  44100,  124800, 24
          encdec, 5   ,  44100,  148800, 24
          encdec, 2.5 ,  44100,  172800, 24
          encdec, 1.25,  44100,  204800, 24
          decode, 10  ,  44100,  124800, 24
          decode, 7.5 ,  44100,  124800, 24
          decode, 5   ,  44100,  148800, 24
          decode, 2.5 ,  44100,  172800, 24
          decode, 1.25,  44100,  204800, 24

